name: Update Tag from Jenkins Trigger

# Jalankan workflow ini hanya ketika menerima event 'repository_dispatch' dengan tipe 'update-image-tag'
on:
  repository_dispatch:
    types: [update-image-tag]

jobs:
  update-gitops-manifest:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repositori GitOps ini sendiri
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Perbarui file manifest (misalnya deployment.yaml) menggunakan tag dari Jenkins payload
      - name: Update Image Tag in Manifest
        run: |
          # Ambil tag yang dikirim oleh Jenkins client_payload
          NEW_TAG="${{ github.event.client_payload.image_tag }}"
          echo "Tag baru dari Jenkins: $NEW_TAG"
          
          # Ganti tag lama dengan tag baru pada file deployment.yaml
          # Ganti URL image di bawah dengan alamat ECR Anda yang sesuai
          sed -i "s|image: .*webstore-app:.*|image: <aws-account-id>.dkr.ecr.<region>.amazonaws.com/webstore-app:$NEW_TAG|g" deployment.yaml
          
      # 3. Commit dan Push perubahan kembali ke repository GitOps ini
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add deployment.yaml
          git commit -m "chore: update webstore-app image tag to ${{ github.event.client_payload.image_tag }} [skip ci]"
          git push origin main
